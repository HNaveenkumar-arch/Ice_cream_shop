<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | SweetCrumbs</title>

    <!-- Google Fonts & Font Awesome -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Nunito:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            overflow: hidden;

            background-color: #0f172a;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }


        .error-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            background-image: url('./asset/w22.webp');
            background-size: cover;
            background-position: center;
            filter: blur(8px);

            transform: scale(1.1);

            z-index: 1;
        }


        .error-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.6) 0%, rgba(15, 23, 42, 0.95) 100%);
            z-index: 2;
        }


        .error-content {
            position: relative;
            z-index: 10;
            text-align: center;
            color: #fff;
            padding: 50px 40px;
            width: 100%;
            max-width: 650px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            transform: translateY(30px) scale(0.95);
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards 0.3s;
        }

        @keyframes fadeUp {
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        .error-badge {
            display: inline-block;
            background: rgba(255, 94, 120, 0.2);
            color: #ffb6c1;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 94, 120, 0.3);
        }

        .error-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 8rem;
            font-weight: 900;

            background: linear-gradient(135deg, #ff5e78, #ffb6c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            line-height: 1;
            text-shadow: 0 10px 30px rgba(255, 94, 120, 0.4);

        }

        .error-content h2 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 800;
            color: #f8fafc;
            font-family: 'Playfair Display', serif;
        }

        .error-content p {
            font-size: 1.15rem;
            color: #cbd5e1;
            margin-bottom: 40px;
            line-height: 1.6;
        }


        .error-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn-premium-rose,
        .btn-premium-glass {
            padding: 16px 32px;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 50px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.4s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
        }

        .btn-premium-rose {
            background: #ff5e78;
            color: #fff;
            border: 2px solid #ff5e78;
            box-shadow: 0 10px 25px rgba(255, 94, 120, 0.4);
        }

        .btn-premium-rose:hover {
            background: #fff;
            color: #ff5e78;
            border-color: #fff;
            transform: translateY(-3px);
        }

        .btn-premium-glass {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }

        .btn-premium-glass:hover {
            background: #fff;
            color: #1a202c;
            border-color: #fff;
            transform: translateY(-3px);
        }


        .falling-ice-creams {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .falling-icon {
            position: absolute;
            top: -10vh;

            animation: fallAndRotate linear infinite;
        }

        @keyframes fallAndRotate {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }


        }


        @media (max-width: 768px) {
            .error-content {
                margin: 20px;
                padding: 40px 25px;
            }

            .error-content h1 {
                font-size: 5.5rem;
            }

            .error-content h2 {
                font-size: 1.6rem;
            }

            .error-content p {
                font-size: 1rem;
                margin-bottom: 30px;
            }

            .error-buttons {
                flex-direction: column;
                gap: 15px;
                width: 100%;
                max-width: 300px;
                margin: 0 auto;
            }

            .btn-premium-rose,
            .btn-premium-glass {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="falling-ice-creams" id="iceCreamContainer"></div>

    <div class="error-bg"></div>
    <div class="error-overlay"></div>

    <div class="error-content">
        <div class="error-badge">Error 404</div>
        <h1 class="glitch-text">404</h1>
        <h2>Oops! Your Scoop Fell Off...</h2>
        <p>The page you are looking for has melted away or never existed in our menu. Let's get you back to the sweet
            stuff.</p>

        <div class="error-buttons">
            <button onclick="history.back()" class="btn-premium-glass">
                <i class="fa-solid fa-arrow-left"></i> Go Back
            </button>

            <a href="index.html" class="btn-premium-rose">
                <i class="fa-solid fa-house"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("iceCreamContainer");

            const icons = ['fa-ice-cream', 'fa-popsicle', 'fa-cake-candles'];

            const colors = ['#ff5e78', '#ffb6c1', '#fcd34d', '#bae6fd', '#ffffff'];

            function createFallingIceCream() {
                const iconEl = document.createElement("i");

                // Pick random icon & color
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];

                iconEl.className = `fa-solid ${randomIcon} falling-icon`;

                iconEl.style.left = Math.random() * 100 + "vw";
                iconEl.style.color = randomColor;

                iconEl.style.filter = `drop-shadow(0 5px 15px ${randomColor}80)`;

                const duration = Math.random() * 7 + 5;
                iconEl.style.animationDuration = duration + "s";

                const size = Math.random() * 1.3 + 1.2;
                iconEl.style.fontSize = size + "rem";

                container.appendChild(iconEl);

                setTimeout(() => {
                    iconEl.remove();
                }, duration * 1000);
            }

            setInterval(createFallingIceCream, 300);
        });
    </script>
</body>

</html>
